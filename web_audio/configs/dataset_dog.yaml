# 狗版数据集配置（S1 记录用，非运行切分工具用）
# 说明：狗版不做 source 级切分（Act_Env 无 dog_id），由 s1_build_dog_manifest.py 做随机分层 85/15。

split:
  strategy: resplit_stratified        # 不用 make_source_split.py（无 source 信息，跑了是假装隔离）
  valid_ratio: 0.15
  seed: 42
  group_by: none                      # source_group_status = unknown
  note: >-
    Act_Env 官方 train/valid 的 valid 仅 455 条且 alert/demand 各 <100，
    噪声太大，故合并后按 label 分层随机重切 85/15。官方 test 3,120 条无标签，v1 不用。

labels:
  classes: [rest, alert, demand, play]
  dropped: [taking shower]
  merge_rules:
    rest: [rest]
    alert: [alerting to sounds]
    demand: [seeking attention, begging for food]
    play: [playing with human, playing with toy, playing with other animals]

dataset:
  id: barkopedia_act_env
  license: MIT              # 数据集打包许可；底层音频来自 YouTube，再授权未证实 → v1 非商用
  sample_rate: 16000
  channels: 1
  bits: 16
  label_origin: model_derived      # Janus-Pro-7B VLM 生成
  review_status: human_verified
  source_group_status: unknown      # 无 dog_id，source 隔离不成立
